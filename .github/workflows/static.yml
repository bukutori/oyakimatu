name: Deploy Vite React site to Pages

on:
  push:
    branches: ["main"] # 如果你的主分支叫 master，請改成 master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'my-art-tools/package-lock.json' # 👈 指向你的專案路徑

      - name: Install dependencies
        run: npm ci
        working-directory: my-art-tools # 👈 讓指令在子資料夾執行

      - name: Build
        run: npm run build
        working-directory: my-art-tools # 👈 讓指令在子資料夾執行

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'my-art-tools/dist' # 👈 Vite 打包後的資料夾位置

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
